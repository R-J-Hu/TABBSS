<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>正在前往最新版下载 · 档案库报站模拟器</title>
  <style>
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; color: #152034; background: #f5f7fa; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    main { width: min(520px, calc(100% - 40px)); padding: 44px; border: 1px solid #dfe5ed; border-radius: 18px; background: #fff; box-shadow: 0 20px 50px rgba(35,58,87,.1); text-align: center; }
    h1 { margin: 0 0 12px; font-size: 25px; } p { color: #667085; line-height: 1.7; }
    a { display: inline-flex; min-height: 46px; margin-top: 12px; padding: 0 20px; align-items: center; justify-content: center; border-radius: 9px; color: #fff; background: #1769e0; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>正在准备最新版下载</h1>
    <p id="message">即将前往 Gitee 下载档案库报站模拟器。</p>
    <a id="manualLink" href="https://gitee.com/rjhu/TABBSS/releases">未自动跳转？点击这里</a>
  </main>
  <script>
    fetch("../latest.json", { cache: "no-store" })
      .then((response) => response.ok ? response.json() : Promise.reject())
      .then((release) => {
        document.querySelector("#message").textContent = `正在下载 V${release.version} Build ${release.build}…`;
        document.querySelector("#manualLink").href = release.gitee;
        window.location.replace(release.gitee);
      })
      .catch(() => {
        document.querySelector("#message").textContent = "暂时无法读取最新版信息，请前往 Gitee 发行版页面。";
      });
  </script>
</body>
</html>
